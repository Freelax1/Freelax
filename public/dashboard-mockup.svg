  <line x1="74" y1="320" x2="362" y2="320" stroke="#F8FAFC" stroke-width="0.5"/>
  <text x="74" y="335" class="row-link">INV-0014</text>
  <text x="154" y="335" class="row">London Ltd</text>
  <text x="284" y="335" class="row-bold">£258</text>
  <rect x="326" y="327" width="28" height="13" rx="4" fill="#EAFAF0"/>
  <text x="330" y="337" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" fill="#1D6B35">Paid</text>
  <line x1="74" y1="344" x2="362" y2="344" stroke="#F8FAFC" stroke-width="0.5"/>
  <text x="74" y="359" class="row-link">INV-0013</text>
  <text x="154" y="359" class="row">Royal Partners</text>
  <text x="284" y="359" class="row-bold">£390</text>
  <rect x="326" y="351" width="28" height="13" rx="4" fill="#EAFAF0"/>
