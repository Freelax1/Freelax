<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Freelax dashboard mockup</title>
  <desc>Mini preview of the Freelax dashboard</desc>
  <defs>
    <style>
      .nav { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 10px; fill: rgba(255,255,255,0.4); }
      .label { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.08em; }
      .hero { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; fill: #94A3B8; }
      .green { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; fill: #1D6B35; }
      .amber { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; fill: #9A7B0A; }
      .heading { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .page-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .page-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 9px; fill: #94A3B8; }
      .row { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 9px; fill: #64748B; }
