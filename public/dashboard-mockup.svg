      .white-sm { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; fill: rgba(255,255,255,0.9); font-weight: 600; }
      .action-label { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; font-weight: 600; fill: #9A7B0A; letter-spacing: 0.1em; }
      .action-row { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 9px; font-weight: 500; fill: #1E293B; }
