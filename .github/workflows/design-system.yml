name: Design system

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run design system checks
        run: npm run check:design-system
